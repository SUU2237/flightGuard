<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>FlightGuard</title>
    <script>
      // 當 GitHub Pages 找不到路由跳 404 時，自動將網址重定向並補上 /#/
      var pathSegmentsToKeep = 1; // 代表 /flightGuard/ 這層子路徑
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/#/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/') +
        (l.search ? '&' + l.search.slice(1) : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
